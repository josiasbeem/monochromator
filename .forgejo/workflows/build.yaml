on:
  push:
    tags:
      - "vscode/v*"
      - "zed/v*"

jobs:
  build:
    runs-on: codeberg-tiny-lazy

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.x"

      - name: Generate themes
        working-directory: generate
        run: |
          go build -v -o generate .
          ./generate

      - name: Get VS Code version
        run: echo "VSCODE_VERSION=$(node -p "require('./editors/vscode/package.json').version")" >> $GITHUB_ENV

      - name: Resolve symlinks
        working-directory: editors/vscode
        run: |
          for link in $(find . -type l); do
            target=$(readlink -f "$link")
            rm "$link"
            cp -r "$target" "$link"
          done

      - name: Package VS Code extension
        working-directory: editors/vscode
        run: npx @vscode/vsce package

      - name: Upload VS Code artifact
        uses: actions/upload-artifact@v3
        with:
          name: "monochromator-vscode-${{ env.VSCODE_VERSION }}"
          path: "editors/vscode/*.vsix"

      - name: Get Zed version
        run: echo "ZED_VERSION=$(sed -n 's/^version *= *\"\(.*\)\"/\1/p' editors/zed/extension.toml)" >> $GITHUB_ENV

      - name: Upload Zed artifact
        uses: actions/upload-artifact@v3
        with:
          name: "monochromator-zed-${{ env.ZED_VERSION }}"
          path: "editors/zed/"
