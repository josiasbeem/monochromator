"comment" = { fg = "fg_muted", modifiers = ["italic"] }
"comment.unused" = { fg = "fg" }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.hint" = { underline = { color = "fg_muted", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diff.delta" = { fg = "orange" }
"diff.delta.moved" = { fg = "green" }
"diff.minus" = { fg = "red" }
"diff.plus" = { fg = "green" }
"error" = { fg = "red" }
"hint" = { fg = "fg_muted" }
"info" = { fg = "blue" }
"ui.background" = { fg = "border", bg = "bg" }
"ui.bufferline" = { fg = "fg_muted", bg = "bg_secondary" }
"ui.bufferline.active" = { fg = "fg", bg = "bg" }
"ui.bufferline.background" = { bg = "bg_secondary" }
"ui.cursor" = { fg = "bg", bg = "fg_muted" }
"ui.cursor.match" = { bg = "bg_selection" }
"ui.cursor.primary" = { fg = "bg", bg = "fg" }
"ui.cursorline.primary" = { bg = "bg_line" }
"ui.help" = { fg = "fg", bg = "bg_secondary" }
"ui.highlight" = { bg = "bg_secondary" }
"ui.linenr" = { fg = "fg_muted" }
"ui.linenr.selected" = { fg = "fg" }
"ui.menu" = { fg = "fg", bg = "bg_secondary" }
"ui.menu.scroll" = { fg = "bg_selection", bg = "bg_secondary" }
"ui.menu.selected" = { fg = "fg", bg = "bg_selection" }
"ui.popup" = { fg = "border", bg = "bg_secondary" }
"ui.popup.info" = { fg = "fg", bg = "bg_secondary" }
"ui.selection" = { bg = "selection" }
"ui.statusline" = { fg = "fg", bg = "bg_secondary" }
"ui.statusline.inactive" = { fg = "fg_muted", bg = "bg_secondary" }
"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "fg", bg = "bg_selection" }
"ui.text.inactive" = { fg = "fg_muted" }
"ui.virtual" = { fg = "fg_faint" }
"ui.virtual.inlay-hint" = { fg = "fg_muted", bg = "inlay_hint" }
"ui.virtual.jump-label" = { fg = "bg", bg = "fg_contrast", modifiers = ["bold"] }
"ui.virtual.ruler" = { bg = "bg_secondary" }
"ui.window" = { fg = "border" }
"warning" = { fg = "orange" }

[palette]
bg = "#08080a"
bg_line = "#161619"
bg_secondary = "#202024"
bg_selection = "#393940"
blue = "#02a9ff"
border = "#505058"
fg = "#cbccd0"
fg_contrast = "#ffffff"
fg_faint = "#2e2e31"
fg_muted = "#808087"
green = "#30df81"
inlay_hint = "#202024"
orange = "#ffae49"
red = "#ff4a4b"
selection = "#393940"
